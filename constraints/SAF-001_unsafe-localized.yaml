id: SAF-001
title: Unsafe локализован и документирован
status: active
hard: true
layer: safety

rule: >
  unsafe-код допускается только в реализациях представлений,
  где необходим доступ по сырому указателю или трансмутация
  индексов.

  Каждый блок unsafe обязан иметь комментарий с инвариантом
  безопасности: какое условие гарантирует корректность.

  Запрещён unsafe в трейтах, в контрактах, в кольцевых
  буферах на уровне оркестратора.

enforcement:
  - Рецензент: каждый блок unsafe имеет комментарий
    с инвариантом
  - Креусот: аннотации на функциях, содержащих unsafe,
    доказывают инвариант
