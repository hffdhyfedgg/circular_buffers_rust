id: ARCH-003
title: Кольцевой буфер — оркестратор
status: active
hard: true
layer: architecture

rule: >
  Кольцевой буфер не является примитивным типом с собственной
  логикой хранения и индексации. Кольцевой буфер — владеющая
  структура, содержащая хранилище и применяющая к нему
  представление кольцевой индексации.

  Кольцевой буфер = Storage + RingView.
  Разделение позволяет заменять хранилище (срез, массив,
  сырой указатель) и представление (прямое, обратное, 2^n)
  независимо.

enforcement:
  - Архитектор: кольцевой буфер определяется как обёртка
    над хранилищем и представлением
  - Рецензент: проверка что логика кольцевой индексации
    не дублируется в кольцевом буфере, а делегирована
    представлению
