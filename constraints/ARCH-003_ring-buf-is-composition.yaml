id: ARCH-003
title: Кольцевой буфер — оркестратор. Кольцевая индексация — конкретное представление.
status: active
hard: true
layer: architecture

rule: >
  Кольцевой буфер не является примитивным типом с собственной
  логикой хранения и индексации. Кольцевой буфер — владеющая
  структура, содержащая хранилище и применяющая к нему
  композицию представлений.

  Кольцевой буфер = Storage + View-композиция.

  Кольцевая индексация (закольцованность) — свойство конкретного
  представления (условно RingView), а не базового трейта всех
  представлений. Базовый трейт View НЕ содержит методов
  get_wrapping, get_rel или иных операций, специфичных для
  кольцевой семантики.

  Обратная индексация (индекс 0 = самый новый элемент) — свойство
  другого конкретного представления (условно InvertView или
  ReverseView), которое компонируется с кольцевым.

  Иерархия:
    Storage (владеет)
      → View (базовая геометрия: длина, доступ по индексу)
        → RingView (закольцованность)
          → InvertView (обратный порядок)
        → StridedView (шаг)
        → TailView (ограничение видимой длины)
        → ...

  Запрещено:
  - помещать get_wrapping, get_rel или иную кольцевую/обратную
    семантику в базовый трейт View;
  - реализовывать кольцевую логику внутри типа кольцевого буфера,
    минуя представление;
  - смешивать в одном трейте базовую геометрию и кольцевую
    семантику.

enforcement:
  - Архитектор: при проектировании трейтов проверяет, что
    кольцевые операции не попадают в базовый View
  - Рецензент: проверяет что базовый View не содержит
    методов с именами *wrapping*, *rel*, *ring*
  - Рецензент: проверяет что кольцевой буфер делегирует
    индексацию представлению, а не реализует её сам
