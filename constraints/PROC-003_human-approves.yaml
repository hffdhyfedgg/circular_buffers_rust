id: PROC-003
title: Человек утверждает
status: active
hard: true
layer: process

rule: >
  Агент не ставит status: approved на дельта-спецификации.
  Агент не создаёт, не редактирует и не удаляет ограничения
  без подтверждения человека.
  Агент не переносит файлы в archive/ без указания человека.

enforcement:
  - AGENTS.md, стоп-правило 3
  - Рецензент проверяет источник изменений
