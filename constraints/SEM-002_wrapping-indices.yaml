id: SEM-002
title: Закольцованность индексов — конкретное представление
status: active
hard: true
layer: semantic

rule: >
  Кольцевое представление принимает отрицательные индексы
  и индексы, выходящие за размер буфера. Индекс приводится
  по модулю к допустимому диапазону.

  Пример для буфера длины 8:
    индекс -1  → физический 7
    индекс 8   → физический 0
    индекс -9  → физический 7

  Закольцованность — инвариант кольцевого представления,
  а не опциональное поведение. Функции закольцованного
  доступа тотальны: не возвращают Option или Result.

  Закольцованность реализуется в конкретном представлении
  (условно RingView). Базовый трейт View НЕ содержит
  метода get_wrapping.

  Запрещено:
  - помещать get_wrapping в базовый трейт View;
  - возвращать Option или Result из закольцованного доступа;
  - паниковать при выходе индекса за диапазон в кольцевом
    представлении.

  Допустимо:
  - базовый View содержит get (с проверкой границ, возвращает
    Option) как холодный метод;
  - кольцевое представление добавляет get_wrapping как горячий
    тотальный метод.

enforcement:
  - Креусот: requires(true) на get_wrapping кольцевого
    представления, отсутствие паник
  - Тесты: отрицательные индексы, индексы > len, индексы < -len
  - Рецензент: проверяет что get_wrapping отсутствует в базовом View
