id: SEM-002
title: Закольцованность индексов
status: active
hard: true
layer: semantic

rule: >
  Кольцевой буфер и кольцевое представление принимают
  отрицательные индексы и индексы, выходящие за размер буфера.
  Индекс приводится по модулю к допустимому диапазону.

  Пример для буфера длины 8:
    индекс -1  → физический 7
    индекс 8   → физический 0
    индекс -9  → физический 7

  Закольцованность — инвариант, а не опциональное поведение.
  Функции доступа по индексу тотальны: не возвращают Option
  или Result.

enforcement:
  - Креусот: requires(true) на функциях доступа,
    отсутствие паник
  - Тесты: отрицательные индексы, индексы > len,
    индексы < -len
