id: SAF-002
title: Гарантия непересечения изменяемых представлений
status: active
hard: true
layer: safety

rule: >
  Если из одного хранилища создаётся несколько изменяемых
  представлений, реализация обязана гарантировать, что
  области памяти не пересекаются.

  Гарантия обеспечивается при создании представления
  (конструктор), а не при каждом доступе.

  Нарушение: два изменяемых представления могут записать
  в один и тот же адрес.

enforcement:
  - Архитектор: контракт конструктора представлений включает
    предусловие непересечения
  - Креусот: лемма непересечения для пар представлений
  - Тест: создание двух изменяемых представлений,
    проверка независимости записи
