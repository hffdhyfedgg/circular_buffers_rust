id: SAF-002
title: Гарантия непересечения изменяемых представлений
status: active
hard: true
layer: safety

rule: >
  Если из одного хранилища создаётся несколько изменяемых
  представлений, реализация обязана гарантировать, что
  области памяти не пересекаются.

  Гарантия обеспечивается при создании представления
  (конструктор или функция разделения), а не при каждом
  доступе.

  Допустимые механизмы гарантии:
  1. Тип-разделитель: функция принимает &mut [T] и возвращает
     два непересекающихся представления. Разделение происходит
     один раз, безопасность следует из того, что &mut [T]
     потреблён и больше не доступен.
  2. Безопасный конструктор с документированным инвариантом:
     конструктор принимает параметры (шаг, смещение, длину)
     и статически или через проверку гарантирует непересечение.
  3. Const generics: размеры и шаги заданы на уровне типов,
     непересечение доказано компилятором.
  4. Креусот-лемма: формальное доказательство непересечения
     для данного набора параметров.

  Запрещено:
  - создавать два изменяемых представления из одного хранилища
    без явного механизма разделения;
  - полагаться на рантайм-проверку пересечения при каждом
    доступе как на основной механизм безопасности;
  - использовать два &mut на одну память без разделения.

  Типичные разрешённые случаи:
  - чётные/нечётные элементы через страйд 2;
  - непересекающиеся страйд-классы;
  - разделение массива на две половины;
  - индексные множества с доказанной уникальностью.

enforcement:
  - Архитектор: контракт конструктора/разделителя включает
    предусловие непересечения
  - Креусот: лемма непересечения для пар представлений
  - Тест: создание двух изменяемых представлений,
    проверка независимости записи
  - Рецензент: проверяет что механизм разделения указан
    в дельта-спецификации
