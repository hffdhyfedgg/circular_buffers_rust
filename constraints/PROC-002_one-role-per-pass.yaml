id: PROC-002
title: Одна роль за проход
status: active
hard: true
layer: process

rule: >
  Архитектор не пишет реализацию. Реализатор не создаёт и не меняет
  трейты-контракты. Рецензент не меняет код.
  Если действие выходит за рамки роли — остановка.

enforcement:
  - AGENTS.md, стоп-правило 2
  - Рецензент проверяет соответствие действий роли
