id: SEM-003
title: Абстракция над хранимым типом
status: active
hard: true
layer: semantic

rule: >
  Все трейты, представления, хранилища и кольцевые буферы
  параметризованы типом хранимого элемента.
  Запрещено фиксировать конкретный тип (f64, u32 и т.д.)
  в сигнатурах трейтов или в определениях структур
  без параметризации.

  Специализации для конкретных типов допустимы как отдельные
  реализации трейтов (например, свёртка для числовых типов),
  но базовые структуры и трейты — generic.

enforcement:
  - Архитектор: все трейты имеют параметр <T>
  - Рецензент: проверка отсутствия монолитных типов
