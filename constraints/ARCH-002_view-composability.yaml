id: ARCH-002
title: Композиция представлений
status: active
hard: true
layer: architecture

rule: >
  Представление может быть построено поверх другого представления
  или поверх хранилища. Композиция — основной механизм построения
  сложных геометрий доступа из простых.

  Механика композиции:
  Внешнее представление содержит внутреннее (или ссылку на него)
  и определяет отображение своих логических индексов на индексы
  внутреннего. Например: внешнее представление «чётные элементы»
  отображает свой индекс i на индекс 2*i внутреннего.

  Композиция должна быть бесплатной абстракцией:
  - компилятор мономорфизирует цепочку представлений;
  - в горячих путях нет виртуальной диспетчеризации (dyn);
  - в горячих путях нет аллокаций;
  - цепочка из N представлений инлайнится в N последовательных
    преобразований индекса.

  Из одного хранилища допустимо создать несколько изменяемых
  представлений одновременно при условии непересечения областей
  памяти (см. SAF-002).

  Запрещено:
  - использовать dyn Trait или Box<dyn Trait> в горячих путях
    представлений;
  - требовать аллокацию при создании композиции;
  - ограничивать глубину вложенности представлений
    на уровне типа (ограничение допустимо только на уровне
    удобства, не на уровне системы типов).

enforcement:
  - Архитектор: трейты представлений принимают внутренний источник
    как generic-параметр или ассоциированный тип
  - Рецензент: проверка отсутствия dyn в сигнатурах горячих функций
  - Компиляция: cargo check подтверждает мономорфизацию
