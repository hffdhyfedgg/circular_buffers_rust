id: ARCH-002
title: Композиция представлений
status: active
hard: true
layer: architecture

rule: >
  Представление может быть построено поверх другого представления.
  Композиция представлений должна быть бесплатной абстракцией
  (инлайниться компилятором, не добавлять косвенных вызовов
  в горячих путях).

  Из одного хранилища допустимо создать несколько изменяемых
  представлений одновременно при условии, что их области памяти
  не пересекаются. Гарантию непересечения обеспечивает реализация
  представления при создании.

enforcement:
  - Архитектор: трейты представлений параметризованы другим
    представлением или хранилищем как ассоциированным типом
    или generic-параметром
  - Рецензент: проверка что композиция не вносит
    динамической диспетчеризации в горячие пути
  - Креусот: леммы непересечения для изменяемых представлений
