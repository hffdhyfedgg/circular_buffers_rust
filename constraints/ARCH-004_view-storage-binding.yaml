id: ARCH-004
title: Механизм связи представления и хранилища
status: active
hard: true
layer: architecture

rule: >
  Архитектурное решение об устройстве представлений обязано
  явно зафиксировать, каким образом представление получает
  доступ к данным хранилища.

  Допустимые механизмы (не исчерпывающий список):
  - время жизни 'a: представление хранит &'a [T] или &'a mut [T];
  - generic-параметр: View<S: Storage>, представление хранит S;
  - ассоциированный тип: type Source в трейте композиции;
  - сырой указатель с документированным инвариантом времени жизни.

  Архитектор обязан выбрать механизм и обосновать выбор
  в дельта-спецификации. Запрещено оставлять вопрос
  «как представление ссылается на данные» открытым
  после архитектурного прохода.

  Если ни один механизм не подходит без нарушения других
  ограничений — архитектор выносит вопрос к человеку.

enforcement:
  - Архитектор: дельта-спецификация содержит явное описание
    механизма связи
  - Рецензент: проверяет что в дельте указан механизм
  - Рецензент: проверяет что трейты представлений содержат
    параметр, выражающий связь с данными
