id: PLAT-002
title: Арифметика из core, не из std
status: active
hard: true
layer: platform

rule: >
  Для числовых операций (сложение, умножение) используются
  трейты из core::ops (core::ops::Add, core::ops::Mul),
  а не из std.

  Запрещено импортировать или использовать
  std::ops::Add, std::ops::Mul и аналоги.

  Свёртка срезов (для числовых типов) ограничена
  трейтами из core::ops.

enforcement:
  - Рецензент: проверка импортов
  - Компиляция с #![no_std] выявляет нарушения
