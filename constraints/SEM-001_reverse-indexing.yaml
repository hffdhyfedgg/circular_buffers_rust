id: SEM-001
title: Обратная индексация — конкретное представление
status: active
hard: true
layer: semantic

rule: >
  Индекс 0 кольцевого буфера даёт доступ к последнему
  добавленному элементу (самому новому). Индекс 1 — к
  предпоследнему. Это требование предметной области (ЦОС).

  Обратная индексация реализуется как отдельное представление
  (условно InvertView или ReverseView), которое компонируется
  с кольцевым представлением. Это НЕ свойство базового трейта
  View и НЕ свойство всех представлений.

  Прямая индексация (0 = первый добавленный) возможна как
  альтернативное представление или как отсутствие инверсии.

  Запрещено:
  - вшивать обратную семантику в базовый трейт View;
  - делать обратную индексацию единственным режимом без
    возможности прямой;
  - смешивать прямую и обратную семантику в одном трейте
    без явного параметра.

enforcement:
  - Архитектор: обратная индексация — отдельный трейт или
    параметр представления
  - Тест: запись последовательности, проверка что [0] = последний
    записанный при использовании обратного представления
  - Креусот: ensures на функции доступа обратного представления
