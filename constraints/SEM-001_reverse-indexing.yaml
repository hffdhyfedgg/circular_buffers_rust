id: SEM-001
title: Обратная индексация кольцевого буфера
status: active
hard: true
layer: semantic

rule: >
  Индекс 0 кольцевого буфера даёт доступ к последнему
  добавленному элементу (самому новому). Индекс 1 — к
  предпоследнему. Это требование предметной области (ЦОС):
  обработка идёт от новых отсчётов к старым.

  Представление кольцевой индексации по умолчанию — обратное.
  Прямая индексация возможна как отдельное представление
  или параметр.

enforcement:
  - Архитектор: контракт кольцевого представления фиксирует
    семантику индекса 0 = наиболее новый элемент
  - Тест: запись последовательности, проверка что [0] = последний
    записанный
  - Креусот: ensures на функции доступа
