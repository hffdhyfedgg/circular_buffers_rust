id: PROC-001
title: Утверждённая дельта-спецификация до кода
status: active
hard: true
layer: process

rule: >
  Запрещено писать реализацию (тела функций, impl-блоки, структуры,
  тесты) до того, как дельта-спецификация имеет status: approved.
  Архитектор фиксирует контракты. Реализатор населяет их.

enforcement:
  - Проверка статуса дельты перед началом реализации
  - Рецензент сверяет наличие утверждённой дельты
