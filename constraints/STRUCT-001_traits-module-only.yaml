id: STRUCT-001
title: Трейты только в модуле traits
status: active
hard: true
layer: structure

rule: >
  Определения трейтов находятся исключительно в модуле
  src/traits.rs или src/traits/ соответствующего крейта.
  В этом модуле: только трейты, макросы для них,
  аннотации Creusot (requires, ensures, variant).
  Тела функций запрещены.

  Доказательства свойств трейтов (logic-функции, леммы)
  находятся в зеркальном модуле src/proofs.rs или src/proofs/.

  Реализации (impl-блоки) находятся в остальных модулях
  и не содержат определений трейтов.

enforcement:
  - Архитектор: трейты записываются для помещения в traits
  - Рецензент: проверка что вне модуля traits нет
    определений trait
  - Рецензент: проверка что в traits нет тел функций
