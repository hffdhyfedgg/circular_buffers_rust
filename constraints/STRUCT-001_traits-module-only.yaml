id: STRUCT-001
title: Трейты только в модуле traits
status: active
hard: true
layer: structure

rule: >
  Определения трейтов находятся исключительно в модуле
  src/traits.rs или src/traits/ соответствующего крейта.

  В этом модуле допустимы:
  - определения трейтов (ключевое слово trait);
  - аннотации Creusot (requires, ensures, variant);
  - документация трейтов и их методов;
  - макросы, генерирующие трейты (если необходимы);
  - однострочные тела методов по умолчанию ТОЛЬКО если они
    выражают тривиальную делегацию (например, is_empty через len).

  Запрещены:
  - тела функций, содержащие логику, ветвление, циклы,
    арифметику сложнее одной операции;
  - определения структур, перечислений, констант;
  - реализации трейтов (impl-блоки);
  - тесты.

  Если архитектор считает, что тело по умолчанию необходимо
  и не является тривиальной делегацией — он обязан вынести
  это в открытые вопросы дельта-спецификации с обоснованием.
  Запрещено молча добавлять нетривиальные тела.

  Доказательства свойств трейтов (logic-функции, леммы)
  находятся в зеркальном модуле src/proofs.rs или src/proofs/.

  Реализации (impl-блоки) находятся в остальных модулях
  и не содержат определений трейтов.

  Каждый трейт в модуле traits обязан содержать комментарий
  со списком затрагиваемых ограничений:
  /// Затрагиваемые ограничения: ARCH-001, SEM-003, STRUCT-001.

enforcement:
  - Архитектор: трейты записываются для помещения в traits
  - Рецензент: проверка что вне модуля traits нет определений trait
  - Рецензент: проверка что в traits нет нетривиальных тел
  - Рецензент: проверка что каждый трейт имеет комментарий
    с ограничениями
