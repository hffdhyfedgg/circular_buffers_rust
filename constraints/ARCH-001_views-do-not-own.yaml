id: ARCH-001
title: Представления не владеют памятью
status: active
hard: true
layer: architecture

rule: >
  Представление (view) задаёт геометрию доступа к памяти,
  но не владеет ею. Владение принадлежит хранилищу (storage).

  Представление содержит ссылку, срез или сырой указатель
  на данные хранилища и параметры индексации (шаг, смещение,
  порядок). Представление не аллоцирует и не освобождает память.

  Нарушение: тип-представление содержит Vec, Box, String,
  или реализует Drop для освобождения памяти,
  или требует владение через аллокатор.

  Допустимые способы ссылки на данные:
  - время жизни 'a и ссылка &'a [T] или &'a mut [T]
  - сырой указатель *const T или *mut T с документированным инвариантом
  - обобщённый параметр, ограниченный трейтом хранилища

enforcement:
  - Архитектор проверяет при проектировании контрактов
  - Рецензент проверяет отсутствие аллокаций в типах-представлениях
  - Компиляция: представление не содержит полей-владельцев
