id: ARCH-001
title: Представления не владеют памятью
status: active
hard: true
layer: architecture

rule: >
  Представление (view) задаёт геометрию доступа к памяти,
  но не владеет ею. Владение принадлежит хранилищу (storage).
  Представление содержит указатель/ссылку и параметры индексации,
  но не аллоцирует и не освобождает память.

  Нарушение: тип, являющийся представлением, содержит Vec, Box,
  или реализует Drop для освобождения памяти.

enforcement:
  - Архитектор проверяет при проектировании контрактов
  - Рецензент проверяет отсутствие аллокаций в типах-представлениях
  - Креусот: отсутствие аллокаций в горячих путях представлений
